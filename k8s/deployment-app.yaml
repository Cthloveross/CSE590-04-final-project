# Kubernetes Deployment for the Nuxt.js Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-platform-app
  namespace: gaming-platform
  labels:
    app: gaming-platform
    component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaming-platform
      component: app
  template:
    metadata:
      labels:
        app: gaming-platform
        component: app
    spec:
      containers:
        - name: nuxt-app
          image: gaming-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            # From ConfigMap
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: gaming-platform-config
                  key: NODE_ENV
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: gaming-platform-config
                  key: JWT_EXPIRES_IN
            - name: NUXT_JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: gaming-platform-config
                  key: NUXT_JWT_EXPIRES_IN
            - name: NUXT_PUBLIC_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: gaming-platform-config
                  key: NUXT_PUBLIC_SITE_URL
            - name: NUXT_PUBLIC_SOCKET_URL
              valueFrom:
                configMapKeyRef:
                  name: gaming-platform-config
                  key: NUXT_PUBLIC_SOCKET_URL
            # From Secrets
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: MONGODB_URI
            - name: NUXT_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: JWT_SECRET
            - name: NUXT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_JWT_SECRET
            - name: NUXT_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_SESSION_PASSWORD
            - name: NUXT_OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_OAUTH_GOOGLE_CLIENT_ID
            - name: NUXT_OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_OAUTH_GOOGLE_CLIENT_SECRET
            - name: NUXT_OAUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_OAUTH_GITHUB_CLIENT_ID
            - name: NUXT_OAUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gaming-platform-secrets
                  key: NUXT_OAUTH_GITHUB_CLIENT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
