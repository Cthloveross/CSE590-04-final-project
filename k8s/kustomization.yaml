# Kustomization file - Deploy all resources with: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gaming-platform

resources:
  - namespace.yaml
  - configmap.yaml
  # NOTE: secrets.yaml is removed! Create secrets from .env instead:
  # kubectl create secret generic gaming-platform-secrets --from-env-file=.env -n gaming-platform --dry-run=client -o yaml | kubectl apply -f -
  - deployment-redis.yaml
  - deployment-app.yaml
  - deployment-socket.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      app: gaming-platform
      managed-by: kustomize

images:
  - name: gaming-platform
    newTag: latest
