# =============================================================================
# Kubernetes Secrets Template
# =============================================================================
# This file contains PLACEHOLDER VALUES only. Do NOT commit real credentials!
#
# HOW TO USE:
# ===========
# Option 1: Create secrets from .env file (RECOMMENDED)
#   kubectl create namespace gaming-platform
#   kubectl create secret generic gaming-platform-secrets \
#     --from-env-file=.env \
#     -n gaming-platform \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Option 2: Edit this file locally (DO NOT COMMIT!)
#   1. Copy this file: cp secrets.yaml secrets.local.yaml
#   2. Edit secrets.local.yaml with real values
#   3. Apply: kubectl apply -f k8s/secrets.local.yaml
#   4. Note: secrets.local.yaml is in .gitignore
#
# PRODUCTION NOTE:
# ================
# In production, use a secrets manager like:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Sealed Secrets for Kubernetes
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: gaming-platform-secrets
  namespace: gaming-platform
  labels:
    app: gaming-platform
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # MongoDB Atlas Connection (REQUIRED)
  # ---------------------------------------------------------------------------
  # Get from: MongoDB Atlas → Cluster → Connect → Connect your application
  MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/game-services"
  NUXT_MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/game-services"
  
  # ---------------------------------------------------------------------------
  # JWT Configuration (REQUIRED)
  # ---------------------------------------------------------------------------
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "your-jwt-secret-at-least-32-characters-long"
  NUXT_JWT_SECRET: "your-jwt-secret-at-least-32-characters-long"
  
  # ---------------------------------------------------------------------------
  # Session Password (REQUIRED)
  # ---------------------------------------------------------------------------
  # Must be at least 32 characters. Generate with: openssl rand -base64 32
  NUXT_SESSION_PASSWORD: "your-session-password-at-least-32-characters-long"
  
  # ---------------------------------------------------------------------------
  # OAuth - Google (OPTIONAL)
  # ---------------------------------------------------------------------------
  # Get from: Google Cloud Console → APIs & Services → Credentials
  # Remember to add redirect URI: http://localhost:30000/api/auth/callback/google
  NUXT_OAUTH_GOOGLE_CLIENT_ID: "your-google-client-id"
  NUXT_OAUTH_GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  
  # ---------------------------------------------------------------------------
  # OAuth - GitHub (OPTIONAL)
  # ---------------------------------------------------------------------------
  # Get from: GitHub → Settings → Developer Settings → OAuth Apps
  # Remember to add callback URL: http://localhost:30000/api/auth/callback/github
  NUXT_OAUTH_GITHUB_CLIENT_ID: "your-github-client-id"
  NUXT_OAUTH_GITHUB_CLIENT_SECRET: "your-github-client-secret"
