# Kubernetes Secrets - Store sensitive configuration
# NOTE: In production, use a secrets manager like HashiCorp Vault, AWS Secrets Manager, or Sealed Secrets
# To create secrets from .env file, run:
# kubectl create secret generic gaming-platform-secrets --from-env-file=.env -n gaming-platform

apiVersion: v1
kind: Secret
metadata:
  name: gaming-platform-secrets
  namespace: gaming-platform
  labels:
    app: gaming-platform
type: Opaque
stringData:
  # MongoDB Atlas connection string
  MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/dbname"
  NUXT_MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/dbname"
  
  # JWT configuration
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  NUXT_JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  
  # Session password (32+ characters)
  NUXT_SESSION_PASSWORD: "your-session-password-at-least-32-characters-long"
  
  # OAuth - Google
  NUXT_OAUTH_GOOGLE_CLIENT_ID: "your-google-client-id"
  NUXT_OAUTH_GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  
  # OAuth - GitHub
  NUXT_OAUTH_GITHUB_CLIENT_ID: "your-github-client-id"
  NUXT_OAUTH_GITHUB_CLIENT_SECRET: "your-github-client-secret"
